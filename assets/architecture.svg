<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>

  <!-- left: agent platforms -->
  <g>
    <rect x="20" y="30" width="130" height="42" rx="8" fill="#eef2f7" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="85" y="56" text-anchor="middle" font-size="14" fill="#1a1a1a">WorkBuddy</text>

    <rect x="20" y="92" width="130" height="42" rx="8" fill="#eef2f7" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="85" y="118" text-anchor="middle" font-size="14" fill="#1a1a1a">Claude Code</text>

    <rect x="20" y="154" width="130" height="42" rx="8" fill="#eef2f7" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="85" y="180" text-anchor="middle" font-size="14" fill="#1a1a1a">Cursor / Trae</text>

    <text x="85" y="225" text-anchor="middle" font-size="12" fill="#555">各 Agent 平台</text>
  </g>

  <!-- middle: manager -->
  <g>
    <rect x="225" y="92" width="150" height="70" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/>
    <text x="300" y="120" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">Agent Skills</text>
    <text x="300" y="140" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">管理器</text>
    <text x="300" y="178" text-anchor="middle" font-size="11" fill="#555">收录 / 安装 / 注册</text>
  </g>

  <!-- right: unified directory -->
  <g>
    <rect x="450" y="40" width="210" height="180" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
    <text x="555" y="66" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">统一技能目录</text>
    <text x="555" y="86" text-anchor="middle" font-size="12" fill="#1a1a1a">C:\Agent Skills\</text>

    <rect x="470" y="100" width="170" height="30" rx="6" fill="#ffffff" stroke="#2f9e44" stroke-width="1"/>
    <text x="555" y="120" text-anchor="middle" font-size="12" fill="#1a1a1a">skills.json</text>

    <rect x="470" y="138" width="80" height="28" rx="6" fill="#ffffff" stroke="#2f9e44" stroke-width="1"/>
    <text x="510" y="157" text-anchor="middle" font-size="12" fill="#1a1a1a">pdf-editor/</text>

    <rect x="560" y="138" width="80" height="28" rx="6" fill="#ffffff" stroke="#2f9e44" stroke-width="1"/>
    <text x="600" y="157" text-anchor="middle" font-size="12" fill="#1a1a1a">agent-reach/</text>

    <rect x="470" y="174" width="170" height="28" rx="6" fill="#ffffff" stroke="#2f9e44" stroke-width="1"/>
    <text x="555" y="193" text-anchor="middle" font-size="12" fill="#1a1a1a">... 更多技能</text>
  </g>

  <!-- arrows: platforms -> manager (collect) -->
  <g stroke="#555" stroke-width="1.5" fill="none">
    <path d="M150 51 C 190 60, 195 95, 222 105" marker-end="url(#arrow)"/>
    <path d="M150 113 C 190 113, 195 118, 222 120" marker-end="url(#arrow)"/>
    <path d="M150 175 C 190 165, 195 128, 222 122" marker-end="url(#arrow)"/>
  </g>
  <text x="183" y="80" text-anchor="middle" font-size="10" fill="#555">收录</text>

  <!-- arrow: manager -> unified dir (install) -->
  <g stroke="#e8590c" stroke-width="2" fill="none">
    <path d="M375 127 C 410 127, 420 110, 447 100" marker-end="url(#arrowOrange)"/>
  </g>
  <text x="412" y="115" text-anchor="middle" font-size="10" fill="#e8590c">安装</text>

  <!-- arrow: unified dir -> agents (read) -->
  <g stroke="#2f9e44" stroke-width="2" fill="none">
    <path d="M450 200 C 380 250, 200 250, 150 200" marker-end="url(#arrowGreen)"/>
  </g>
  <text x="300" y="262" text-anchor="middle" font-size="11" fill="#2f9e44">读取 / @调用（共享同一目录）</text>

  <!-- arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e8590c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f9e44"/>
    </marker>
  </defs>
</svg>
